[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inlet"
version = "0.1.2"
description = "Maps database-access call sites in a Python codebase and classifies each by risk shape: parameterized, concatenated, or uncertain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hassan Balbakie" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
inlet = "inlet.cli:main"

[tool.setuptools.packages.find]
include = ["inlet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
